[pytest]
# The app runs with its package folders on the import path, so a lot of modules
# import each other bare — `import mainwindow`, `from local_env import ...`.
# Without that here, 20 test files fail to import and report as errors, which
# reads as "the suite is broken" when nothing is wrong with the code at all.
#
# Measured 2026-10-28: 20 files errored on `ModuleNotFoundError: No module
# named 'mainwindow'` / `'local_env'` until these three entries existed.
pythonpath = . ui core

testpaths = tests

# RUNNING THE SUITE
#
#     python -m pytest
#
# That is the whole thing: 981 passed, 1 skipped, in about two minutes
# (2026-10-28). It needs no plugin and no environment setup.
#
# It did not always work. Eleven of these files import GUI code without a Qt
# runtime by putting hand-built stand-ins into `sys.modules` — not only PyQt6
# but the `ui` and `core` packages — while twenty-five others need the real
# PyQt6. pytest imports every test module during collection, before running
# anything, so whichever file loaded last decided what all of them saw, and
# `pytest tests` reported 169 failures and 135 errors that were nothing but
# that collision.
#
# `tests/conftest.py` fixes it: each file imports into its own world, which is
# swapped back in around that file's own tests. See the comments there before
# changing it — the scope of what it isolates is load-bearing in both
# directions.
